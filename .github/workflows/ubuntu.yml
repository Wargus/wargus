name: ubuntu

on:
  workflow_dispatch:
    inputs:
      stratagus_ref:
        description: 'Stratagus branch, tag or commit to build against'
        required: false
        default: 'master'
  # Rebuilt when the engine or the shared dependencies move. See the
  # "Downstream builds" workflow in Wargus/stratagus.
  repository_dispatch:
    types: [engine-update]
  push:
    paths:
      - '**'
      - '!.github/**'
      - '!**.yml'
      - '.github/workflows/ubuntu.yml'
      - '!**.md'
      - '!.vscode/**'
      - '!doc/**'

  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '!**.yml'
      - '.github/workflows/ubuntu.yml'
      - '!**.md'
      - '!.vscode/**'
      - '!doc/**'

env:
  build_type: Release

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Wargus
      uses: actions/checkout@v7
      with:
        submodules: recursive
        path: wargus

    - name: Resolve which Stratagus to build against
      id: stratagus
      env:
        requested_ref: ${{ inputs.stratagus_ref }}
      run: |
        # A change that spans the engine and the game is developed on branches of
        # the same name in both repositories, so prefer the engine branch that
        # matches this one. Tags, and any branch the engine does not have, build
        # against master. workflow_dispatch can name a revision explicitly.
        branch=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
        for ref in "$requested_ref" "$branch" master; do
          if [ -z "$ref" ]; then
            continue
          fi
          if git ls-remote --exit-code https://github.com/Wargus/stratagus "refs/heads/$ref" > /dev/null; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "building against Wargus/stratagus@$ref"
            exit 0
          fi
          if [ "$ref" = "$requested_ref" ]; then
            echo "workflow_dispatch asked for Wargus/stratagus@$ref, which does not exist" >&2
            exit 1
          fi
        done

    - name: Checkout Stratagus
      uses: actions/checkout@v7
      with:
        repository: Wargus/stratagus
        ref: ${{ steps.stratagus.outputs.ref }}
        submodules: recursive
        path: stratagus

    # Nothing is installed for the game itself: png, zlib, bzip2 and StormLib
    # are the ones from the shared dependencies submodule. Only the engine
    # brings in what it cannot vendor, which is the same set its own Linux jobs
    # rely on.
    - name: build Stratagus
      run: |
        cmake -S stratagus -B stratagus/build -DCMAKE_BUILD_TYPE=$build_type -DBUILD_VENDORED_LUA=ON -DBUILD_VENDORED_SDL=ON -DBUILD_VENDORED_MEDIA_LIBS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build stratagus/build --config $build_type

    - name: build Wargus
      run: |
        cmake -S wargus -B wargus/build -DCMAKE_BUILD_TYPE=$build_type -DSTRATAGUS=$GITHUB_WORKSPACE/stratagus/build/stratagus -DSTRATAGUS_INCLUDE_DIR=$GITHUB_WORKSPACE/stratagus/gameheaders
        cmake --build wargus/build --config $build_type
