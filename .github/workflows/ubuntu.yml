name: ubuntu

on:
  workflow_dispatch:
  # Rebuilt when the engine or the shared dependencies move. See the
  # "Downstream builds" workflow in Wargus/stratagus.
  repository_dispatch:
    types: [engine-update]
  push:
    paths:
      - '**'
      - '!.github/**'
      - '!**.yml'
      - '.github/workflows/ubuntu.yml'
      - '!**.md'
      - '!.vscode/**'
      - '!doc/**'

  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '!**.yml'
      - '.github/workflows/ubuntu.yml'
      - '!**.md'
      - '!.vscode/**'
      - '!doc/**'

env:
  build_type: Release

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Wargus
      uses: actions/checkout@v7
      with:
        submodules: recursive
        path: wargus

    - name: Resolve which Stratagus to build against
      id: stratagus
      run: |
        # The engine and the game are released in lockstep: a tag in this
        # repository has an engine tag of the same name, and a change that spans
        # both repositories is developed on branches of the same name. So look for
        # the same kind of ref as the one we are running on, and build against the
        # engine master branch when the engine does not have it.
        engine=https://github.com/Wargus/stratagus
        # A pull request builds the branch it came from, not the merge ref.
        name=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          candidate=refs/tags/$name
        else
          candidate=refs/heads/$name
        fi

        if git ls-remote --exit-code --refs "$engine" "$candidate" > /dev/null; then
          ref=$name
          probe=$candidate
        else
          probe=refs/heads/master
          if ! git ls-remote --exit-code --refs "$engine" "$probe" > /dev/null; then
            echo "Wargus/stratagus has neither $candidate nor $probe" >&2
            exit 1
          fi
          ref=master
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "building against Wargus/stratagus@$ref ($probe)"

    - name: Checkout Stratagus
      uses: actions/checkout@v7
      with:
        repository: Wargus/stratagus
        ref: ${{ steps.stratagus.outputs.ref }}
        submodules: recursive
        path: stratagus

    # Nothing is installed for the game itself: png, zlib, bzip2 and StormLib
    # are the ones from the shared dependencies submodule. Only the engine
    # brings in what it cannot vendor, which is the same set its own Linux jobs
    # rely on.
    - name: build Stratagus
      run: |
        cmake -S stratagus -B stratagus/build -DCMAKE_BUILD_TYPE=$build_type -DBUILD_VENDORED_LUA=ON -DBUILD_VENDORED_SDL=ON -DBUILD_VENDORED_MEDIA_LIBS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build stratagus/build --config $build_type

    - name: build Wargus
      run: |
        cmake -S wargus -B wargus/build -DCMAKE_BUILD_TYPE=$build_type -DSTRATAGUS=$GITHUB_WORKSPACE/stratagus/build/stratagus -DSTRATAGUS_INCLUDE_DIR=$GITHUB_WORKSPACE/stratagus/gameheaders
        cmake --build wargus/build --config $build_type
