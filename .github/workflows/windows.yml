name: windows

# What happens here is in Wargus/stratagus, next to the engine that is built with
# it: this file only says when Wargus is built for the installer of this repository.

on:
  workflow_dispatch:
  # A manual request to build against the current engine, e.g. with
  # gh api --method POST -f event_type=engine-update repos/Wargus/wargus/dispatches/repository
  repository_dispatch:
    types: [engine-update]
  push:
    # master and version tags only: a push to a branch with a pull request would
    # build what the pull_request event already builds, and a branch that is
    # neither released nor reviewed needs no artifacts of its own.
    branches: [master]
    tags: ['v*', '[0-9]*']
  pull_request:

# Pushing a tag or building master publishes the installer, and every artifact of a
# revision goes to the release of that revision.
permissions:
  contents: write

jobs:
  wargus:
    # The ref the shared workflow is taken from: the branch until it is merged,
    # master afterwards.
    uses: Wargus/stratagus/.github/workflows/game-build.yml@timfel/release-refactoring
    with:
      game_id: wargus
      game_name: Wargus
      platform: windows
    secrets: inherit
